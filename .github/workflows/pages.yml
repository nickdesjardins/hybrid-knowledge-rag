# Publishes the folder site/ on GitHub Pages. That page is the address to give to people: it is
# there at once, shows recorded runs, and wakes the live demo (which sleeps on its free host)
# while the visitor reads.
#
# One thing has to be done by hand, once, before the first push: in the repository's
# Settings > Pages, set Source to "GitHub Actions".
name: Project page

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish site/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # These three are the versions GitHub's own Pages examples pair together. They still run on
      # Node 20, so the run shows a yellow deprecation note; it does not stop the deploy.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
