[project]
name = "hybrid-retrieval-engine"
version = "1.0.0"
description = "Context-Aware Hybrid Knowledge & Compliance Retrieval Engine (pgvector + tsvector + RRF + Cohere Rerank + grounded citations)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` / `File(...)` in parameter defaults is the FastAPI dependency idiom.
ignore = ["B008"]

[tool.ruff.lint.pycodestyle]
# Code is formatted at 100 columns; docstrings, comments and SQL literals may run a little longer.
max-line-length = 112

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/make_demo_corpus.py" = ["E501"]  # prose paragraphs of the fictional SOPs
